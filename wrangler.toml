name = "sublinks-work"
main = "worker.js"
compatibility_date = "2024-01-01"

# Keep dashboard-managed admin variables (ADMIN_USERNAME/ADMIN_PASSWORD) on deploy.
keep_vars = true

[vars]
ADMIN_PATH = "admin"

# KV storage replaces the former D1 binding.
[[kv_namespaces]]
binding = "SUBLINK_KV"
id = "953fcf4d7b8148fc88f438203bf863cf"
